<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YA SALAM BUSINESS</title>

<style>
body{
  font-family:Arial;
  margin:0;
  background:#f5f5f5;
  color:#222
}

header{
  background:#087f23;
  color:white;
  text-align:center;
  padding:20px
}

main{
  max-width:500px;
  margin:auto;
  padding:15px
}

.card{
  background:white;
  padding:20px;
  margin:15px 0;
  border-radius:12px
}

input,button{
  width:100%;
  padding:13px;
  margin:7px 0;
  box-sizing:border-box
}

button{
  background:#087f23;
  color:white;
  border:0;
  border-radius:7px;
  font-weight:bold
}

.tabs{
  display:flex;
  gap:8px
}

.tabs button{
  width:50%
}

#result,#walletMsg{
  margin-top:10px
}
</style>
</head>

<body>

<header>
<h1>YA SALAM BUSINESS</h1>
<p>NIN & BVN Verification</p>
</header>

<main>

<div class="card">

<h2>💰 My Wallet</h2>

<input
 id="email"
 type="email"
 placeholder="Enter your email"
 value="sagirushuaibu999@gmail.com"
>

<button onclick="checkWallet()">
Check Wallet
</button>

<h2 id="balance">₦0.00</h2>

<input
 id="amount"
 type="number"
 placeholder="Amount to fund (₦)"
 min="100"
>

<button type="button" onclick="fundWallet();">
  Fund Wallet
</button>

<p id="walletMsg"></p>

</div>

<div class="card">

<div class="tabs">
<button onclick="setType('nin')">NIN</button>
<button onclick="setType('bvn')">BVN</button>
</div>

<input
 id="number"
 maxlength="11"
 placeholder="Enter 11-digit NIN"
>

<p>Verification fee: <b>₦100</b></p>

<button onclick="verify()">
Verify Now
</button>

<p id="result"></p>

</div>

</main>

<script>

const API =
"https://ya-salam-business-api.onrender.com";

let type="nin";

/* =========================
   NIN / BVN TYPE
========================= */

function setType(t){

  type=t;

  document.getElementById("number").value="";

  document.getElementById("number").placeholder =
    t==="nin"
    ? "Enter 11-digit NIN"
    : "Enter 11-digit BVN";
}


/* =========================
   CHECK WALLET
========================= */

async function checkWallet(){

  const email =
    document.getElementById("email").value.trim();

  const balance =
    document.getElementById("balance");

  const msg =
    document.getElementById("walletMsg");

  if(!email){

    msg.textContent =
      "Enter your email first";

    return;
  }

  balance.textContent = "Loading...";

  msg.textContent = "";

  try{

    const url =
      API +
      "/api/wallet/" +
      encodeURIComponent(email);

    const response =
      await fetch(url);

    if(!response.ok){

      throw new Error(
        "Server returned " +
        response.status
      );
    }

    const data =
      await response.json();

    if(data.status !== "success"){

      throw new Error(
        data.message ||
        "Unable to load wallet"
      );
    }

    const amount =
      Number(data.wallet?.balance || 0);

    balance.textContent =
      "₦" + amount.toFixed(2);

    msg.textContent =
      "Wallet updated successfully";

  }catch(error){

    console.error("Wallet error:",error);

    balance.textContent =
      "₦0.00";

    msg.textContent =
      "Unable to load wallet. Please try again.";

  }
}


/* =========================
   FUND WALLET
========================= */

async function fundWallet(){

  try{

    const email =
      document.getElementById("email").value.trim();

    const amount =
      Number(
        document.getElementById("amount").value
      );

    if(!email){

      document.getElementById("walletMsg")
      .textContent =
        "Enter your email first";

      return;
    }

    if(amount < 100){

      document.getElementById("walletMsg")
      .textContent =
        "Minimum is ₦100";

      return;
    }

    document.getElementById("walletMsg")
    .textContent =
      "Opening Paystack...";

    const r =
      await fetch(
        API + "/api/wallet/fund",
        {
          method:"POST",
          headers:{
            "Content-Type":
            "application/json"
          },
          body:JSON.stringify({
            email,
            amount
          })
        }
      );

    const d =
      await r.json();

    if(d.authorization_url){

      location.href =
        d.authorization_url;

    }else{

      document.getElementById(
        "walletMsg"
      ).textContent =
        d.message ||
        "Payment error";
    }

  }catch(e){

    console.error(e);

    document.getElementById(
      "walletMsg"
    ).textContent =
      "Connection error";
  }
}


/* =========================
   NIN / BVN VERIFY
========================= */

async function verify(){

  try{

    const email =
      document.getElementById("email")
      .value.trim();

    const n =
      document.getElementById("number")
      .value.trim();

    if(!email){

      document.getElementById("result")
      .textContent =
        "Enter your email first";

      return;
    }

    if(!/^\d{11}$/.test(n)){

      document.getElementById("result")
      .textContent =
        "Enter 11 digits";

      return;
    }

    document.getElementById("result")
    .textContent =
      "Checking wallet and verifying...";

    const r =
      await fetch(
        API + "/api/" + type + "/verify",
        {
          method:"POST",
          headers:{
            "Content-Type":
            "application/json"
          },
          body:JSON.stringify({
            email:email,
            idNumber:n
          })
        }
      );

    const d =
      await r.json();

    const result =
  document.getElementById("result");

if(d.status === "success"){

  result.innerHTML =
    "<b>" +
    (d.message || "Verification successful") +
    "</b><br>" +
    "Wallet Balance: ₦" +
    Number(d.balance || 0).toFixed(2);

  // Show verification details
if(d.verification){

  const v = d.verification.data || d.verification;

  let html =
    "<hr><b>Verification Details</b><br>";

  function addField(label, value){
    if(
      value !== undefined &&
      value !== null &&
      value !== ""
    ){
      html +=
        "<div style='margin-top:6px'>" +
        "<b>" + label + ":</b> " +
        String(value) +
        "</div>";
    }
  }

  addField("First Name", v.first_name);
  addField("Last Name", v.last_name);
  addField("Date of Birth", v.date_of_birth);
  addField("Gender", v.gender);
  addField("Status", v.status);

  result.innerHTML += html;
}

    // Common fields
    addField("Name", v.name);
    addField("First Name", v.firstName);
    addField("Middle Name", v.middleName);
    addField("Last Name", v.lastName);
    addField("Date of Birth", v.dateOfBirth);
    addField("Gender", v.gender);
    addField("Phone", v.phone);
    addField("Status", v.status);

    // Some APIs put the actual record inside data
    if(v.data && typeof v.data === "object"){

      addField("Name", v.data.name);
      addField("First Name", v.data.firstName);
      addField("Middle Name", v.data.middleName);
      addField("Last Name", v.data.lastName);
      addField("Date of Birth", v.data.dateOfBirth);
      addField("Gender", v.data.gender);
      addField("Phone", v.data.phone);
      addField("Status", v.data.status);
    }

    result.innerHTML += html;
  }

  checkWallet();

}else{

  result.textContent =
    d.message ||
    "Verification failed";
  }

    

  }catch(e){

    console.error(e);

    document.getElementById(
      "result"
    ).textContent =
      "Connection error";
  }
}


/* =========================
   PAYSTACK RETURN
========================= */

const params =
  new URLSearchParams(
    location.search
  );

const reference =
  params.get("reference") ||
  params.get("trxref");

if(reference){

  document.getElementById(
    "walletMsg"
  ).textContent =
    "Confirming payment...";

  fetch(
    API +
    "/api/wallet/verify/" +
    encodeURIComponent(reference)
  )
  .then(r => r.json())
  .then(d => {

    document.getElementById(
      "walletMsg"
    ).textContent =
      d.message ||
      "Payment checked";

    checkWallet();

  })
  .catch(() => {

    document.getElementById(
      "walletMsg"
    ).textContent =
      "Unable to confirm payment";
  });
}


/* =========================
   LOAD WALLET
========================= */

checkWallet();

</script>

</body>
</html>
