<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YA SALAM BUSINESS</title>
<style>
body{font-family:Arial;margin:0;background:#f5f5f5;color:#222}
header{background:#087f23;color:white;text-align:center;padding:20px}
main{max-width:500px;margin:auto;padding:15px}
.card{background:white;padding:20px;margin:15px 0;border-radius:12px}
input,button{width:100%;padding:13px;margin:7px 0;box-sizing:border-box}
button{background:#087f23;color:white;border:0;border-radius:7px;font-weight:bold}
.tabs{display:flex;gap:8px}.tabs button{width:50%}
#result{margin-top:10px}
</style>
</head>

<body>

<header>
<h1>YA SALAM BUSINESS</h1>
<p>NIN & BVN Verification</p>
</header>

<main>

<div class="card">
<h2>💰 My Wallet</h2>

<input id="email" type="email"
placeholder="Enter your email"
value="sagirushuaibu999@gmail.com">

<button onclick="checkWallet()">Check Wallet</button>

<h2 id="balance">₦0.00</h2>

<input id="amount" type="number"
placeholder="Amount to fund (₦)" min="100">

<button onclick="fundWallet()">Fund Wallet</button>

<p id="walletMsg"></p>
</div>

<div class="card">
<div class="tabs">
<button onclick="type='nin'">NIN</button>
<button onclick="type='bvn'">BVN</button>
</div>

<input id="number" maxlength="11"
placeholder="Enter 11-digit NIN">

<button onclick="verify()">Verify Now</button>
<p id="result"></p>
</div>

</main>

<script>
const API="https://ya-salam-business-api.onrender.com";
let type="nin";

async function checkWallet(){
 const email=document.getElementById("email").value.trim();
 if(!email)return;
 const r=await fetch(API+"/api/wallet/"+encodeURIComponent(email));
 const d=await r.json();
 document.getElementById("balance").textContent=
   "₦"+Number(d.wallet?.balance||0).toFixed(2);
}

async function fundWallet(){
 const email=document.getElementById("email").value.trim();
 const amount=Number(document.getElementById("amount").value);

 if(!email||amount<100){
   document.getElementById("walletMsg").textContent="Minimum is ₦100";
   return;
 }

 document.getElementById("walletMsg").textContent="Opening Paystack...";

 const r=await fetch(API+"/api/wallet/fund",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({email,amount})
 });

 const d=await r.json();

 if(d.authorization_url){
   location.href=d.authorization_url;
 }else{
   document.getElementById("walletMsg").textContent=
     d.message||"Payment error";
 }
}

async function verify(){
 const n=document.getElementById("number").value.trim();

 if(n.length!==11){
   document.getElementById("result").textContent=
     "Enter 11 digits";
   return;
 }

 document.getElementById("result").textContent="Verifying...";

 const r=await fetch(API+"/api/"+type+"/verify",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({[type]:n})
 });

 const d=await r.json();
 document.getElementById("result").textContent=
   d.message||JSON.stringify(d);
}

/* After Paystack returns */
const params=new URLSearchParams(location.search);
const reference=params.get("reference")||params.get("trxref");

if(reference){
 document.getElementById("walletMsg").textContent=
   "Confirming payment...";

 fetch(API+"/api/wallet/verify/"+encodeURIComponent(reference))
 .then(r=>r.json())
 .then(d=>{
   document.getElementById("walletMsg").textContent=
     d.message||"Payment checked";
   checkWallet();
 });
}
</script>

</body>
</html>
