<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>YA SALAM BUSINESS — NIN & BVN Verification</title>

<meta name="description"
content="YA SALAM BUSINESS NIN and BVN verification service.">

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f1f8f3;
  color:#17231b;
}

header{
  background:linear-gradient(135deg,#006b1b,#0b982f);
  color:white;
  text-align:center;
  padding:25px 15px 30px;
  box-shadow:0 3px 12px rgba(0,0,0,.15);
}

.logo{
  width:82px;
  height:82px;
  margin:0 auto 12px;
  border-radius:50%;
  background:white;
  display:flex;
  align-items:center;
  justify-content:center;
  border:4px solid #d9f7df;
  box-shadow:0 4px 12px rgba(0,0,0,.2);
}

.logo-inner{
  width:62px;
  height:62px;
  border-radius:50%;
  background:#087f23;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  font-weight:bold;
  letter-spacing:1px;
}

header h1{
  margin:5px 0;
  font-size:25px;
}

header p{
  margin:5px 0 0;
  opacity:.95;
}

main{
  max-width:520px;
  margin:auto;
  padding:15px;
}

.card{
  background:white;
  padding:20px;
  margin:15px 0;
  border-radius:15px;
  box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.card h2{
  margin-top:0;
}

input,
button{
  width:100%;
  padding:14px;
  margin:7px 0;
  box-sizing:border-box;
  font-size:16px;
}

input{
  border:1px solid #ccd8cf;
  border-radius:8px;
  outline:none;
}

input:focus{
  border-color:#087f23;
  box-shadow:0 0 0 2px rgba(8,127,35,.1);
}

button{
  background:#087f23;
  color:white;
  border:0;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#06681d;
}

.balance{
  text-align:center;
  color:#087f23;
  font-size:28px;
}

.tabs{
  display:flex;
  gap:8px;
}

.tabs button{
  width:50%;
}

.tabs button:first-child{
  background:#087f23;
}

.info{
  background:#eef8f0;
  padding:12px;
  border-radius:8px;
  font-size:14px;
}

#result,
#walletMsg{
  margin-top:12px;
  line-height:1.6;
}

.success{
  color:#087f23;
  font-weight:bold;
}

.footer{
  text-align:center;
  padding:20px;
  color:#666;
  font-size:13px;
}

hr{
  border:0;
  border-top:1px solid #ddd;
  margin:15px 0;
}

</style>
</head>

<body>

<header>

  <div class="logo">
    <div class="logo-inner">
      YSB
    </div>
  </div>

  <h1>YA SALAM BUSINESS</h1>

  <p>NIN & BVN Verification</p>

</header>

<main>

<!-- WALLET -->

<div class="card">

  <h2>💰 My Wallet</h2>

  <input
    id="email"
    type="email"
    placeholder="Enter your email"
    value="sagirushuaibu999@gmail.com"
  >

  <button
    type="button"
    onclick="checkWallet()">
    Check Wallet
  </button>

  <h2
    id="balance"
    class="balance">
    ₦0.00
  </h2>

  <input
    id="amount"
    type="number"
    value="100"
    placeholder="Amount to fund (₦)"
    min="100"
  >

  <button
    type="button"
    onclick="fundWallet()">
    💳 Fund Wallet
  </button>

  <p id="walletMsg">
    Ready to fund wallet
  </p>

</div>


<!-- VERIFICATION -->

<div class="card">

  <div class="tabs">

    <button
      type="button"
      onclick="setType('nin')">
      NIN
    </button>

    <button
      type="button"
      onclick="setType('bvn')">
      BVN
    </button>

  </div>

  <input
    id="number"
    maxlength="11"
    inputmode="numeric"
    placeholder="Enter 11-digit NIN"
  >

  <div class="info">
    Verification fee:
    <b>₦100</b>
  </div>

  <button
    type="button"
    onclick="verify()">
    🔍 Verify Now
  </button>

  <div id="result"></div>

</div>

</main>

<div class="footer">
  © 2026 YA SALAM BUSINESS
</div>


<script>

const API =
"https://ya-salam-business-api.onrender.com";

let type = "nin";


/* =========================
   NIN / BVN TYPE
========================= */

function setType(t){

  type = t;

  const number =
    document.getElementById("number");

  number.value = "";

  number.placeholder =
    t === "nin"
    ? "Enter 11-digit NIN"
    : "Enter 11-digit BVN";
}


/* =========================
   CHECK WALLET
========================= */

async function checkWallet(){

  const email =
    document.getElementById("email")
    .value.trim();

  const balance =
    document.getElementById("balance");

  const msg =
    document.getElementById("walletMsg");

  if(!email){

    msg.textContent =
      "Enter your email first";

    return;
  }

  balance.textContent =
    "Loading...";

  msg.textContent =
    "Checking wallet...";

  try{

    const response =
      await fetch(
        API +
        "/api/wallet/" +
        encodeURIComponent(email)
      );

    const data =
      await response.json();

    if(!response.ok ||
       data.status !== "success"){

      throw new Error(
        data.message ||
        "Unable to load wallet"
      );
    }

    const amount =
      Number(
        data.wallet?.balance || 0
      );

    balance.textContent =
      "₦" +
      amount.toFixed(2);

    msg.textContent =
      "Wallet updated successfully";

  }catch(error){

    console.error(
      "Wallet error:",
      error
    );

    balance.textContent =
      "₦0.00";

    msg.textContent =
      "Unable to load wallet. Please try again.";
  }
}


/* =========================
   FUND WALLET
========================= */

async function fundWallet(){

  const msg =
    document.getElementById("walletMsg");

  try{

    const email =
      document.getElementById("email")
      .value.trim();

    const amount =
      Number(
        document.getElementById("amount")
        .value
      );

    if(!email){

      msg.textContent =
        "Enter your email first";

      return;
    }

    if(!Number.isFinite(amount) ||
       amount < 100){

      msg.textContent =
        "Minimum funding amount is ₦100";

      return;
    }

    msg.textContent =
      "Opening Paystack...";

    const response =
      await fetch(
        API + "/api/wallet/fund",
        {
          method:"POST",

          headers:{
            "Content-Type":
            "application/json"
          },

          body:JSON.stringify({
            email:email,
            amount:amount
          })
        }
      );

    const data =
      await response.json();

    if(!response.ok){

      throw new Error(
        data.message ||
        "Payment request failed"
      );
    }

    if(data.authorization_url){

      msg.textContent =
        "Redirecting to Paystack...";

      window.location.href =
        data.authorization_url;

      return;
    }

    msg.textContent =
      data.message ||
      "Unable to open Paystack.";

  }catch(error){

    console.error(
      "Fund wallet error:",
      error
    );

    msg.textContent =
      error.message ||
      "Connection error. Please try again.";
  }
}


/* =========================
   NIN / BVN VERIFY
========================= */

async function verify(){

  const result =
    document.getElementById("result");

  try{

    const email =
      document.getElementById("email")
      .value.trim();

    const number =
      document.getElementById("number")
      .value.trim();

    if(!email){

      result.textContent =
        "Enter your email first";

      return;
    }

    if(!/^\d{11}$/.test(number)){

      result.textContent =
        "Enter exactly 11 digits";

      return;
    }

    result.textContent =
      "Checking wallet and verifying...";

    const response =
      await fetch(
        API +
        "/api/" +
        type +
        "/verify",
        {
          method:"POST",

          headers:{
            "Content-Type":
            "application/json"
          },

          body:JSON.stringify({
            email:email,
            idNumber:number
          })
        }
      );

    const data =
      await response.json();

    if(data.status !== "success"){

      result.textContent =
        data.message ||
        "Verification failed";

      return;
    }

    result.innerHTML =
      "<div class='success'>" +
      (data.message ||
       "Verification successful") +
      "</div>" +

      "<div style='margin-top:6px'>" +
      "Wallet Balance: ₦" +
      Number(
        data.balance || 0
      ).toFixed(2) +
      "</div>";


    /* =========================
       VERIFICATION DETAILS
    ========================= */

    if(data.verification){

      const v =
        data.verification.data ||
        data.verification;

      let html =
        "<hr>" +
        "<b>Verification Details</b>";

      function addField(
        label,
        value
      ){

        if(
          value !== undefined &&
          value !== null &&
          value !== ""
        ){

          html +=
            "<div style='margin-top:6px'>" +
            "<b>" +
            label +
            ":</b> " +
            String(value) +
            "</div>";
        }
      }

      addField(
        "First Name",
        v.first_name
      );

      addField(
        "Last Name",
        v.last_name
      );

      addField(
        "Date of Birth",
        v.date_of_birth
      );

      addField(
        "Gender",
        v.gender
      );

      addField(
        "Status",
        v.status
      );

      result.innerHTML += html;
    }

    await checkWallet();

  }catch(error){

    console.error(
      "Verification error:",
      error
    );

    result.textContent =
      "Connection error. Please try again.";
  }
}


/* =========================
   PAYSTACK RETURN
========================= */

const params =
  new URLSearchParams(
    window.location.search
  );

const reference =
  params.get("reference") ||
  params.get("trxref");

if(reference){

  const msg =
    document.getElementById(
      "walletMsg"
    );

  msg.textContent =
    "Confirming payment...";

  fetch(
    API +
    "/api/wallet/verify/" +
    encodeURIComponent(reference)
  )
  .then(
    response =>
      response.json()
  )
  .then(
    data => {

      msg.textContent =
        data.message ||
        "Payment checked";

      checkWallet();

    }
  )
  .catch(
    () => {

      msg.textContent =
        "Unable to confirm payment";
    }
  );
}


/* =========================
   LOAD WALLET
========================= */

checkWallet();

</script>

</body>
      </html>
