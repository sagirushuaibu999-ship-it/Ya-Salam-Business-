</style></head><body><header>  <div class="logo">
    <div class="logo-inner">YSB</div>
  </div>  <h1>YA SALAM BUSINESS</h1>  <p>NIN, BVN & KYC Verification</p></header><main><!-- WALLET --><div class="card">  <h2>💰 My Wallet</h2><input
id="email"
type="email"
placeholder="Enter your email"
value="sagirushuaibu999@gmail.com"

  <button onclick="checkWallet()">
    Check Wallet
  </button>  <h2 id="balance" class="balance">
    ₦0.00
  </h2><input
id="amount"
type="number"
value="100"
min="100"
placeholder="Amount to fund (₦)"

«»

  <button onclick="fundWallet()">
    💳 Fund Wallet
  </button>  <p id="walletMsg">
    Ready to fund wallet
  </p></div><!-- NIN / BVN --><div class="card">  <h2>🪪 NIN & BVN Verification</h2>  <div class="tabs"><button onclick="setType('nin')">
  NIN
</button>

<button onclick="setType('bvn')">
  BVN
</button>

  </div><input
id="number"
maxlength="11"
inputmode="numeric"
placeholder="Enter 11-digit NIN"

«»

  <div class="info">
    Verification fee: <b>₦100</b>
  </div>  <button onclick="verify()">
    🔍 Verify Now
  </button>  <div id="result"></div></div><!-- DIDIT --><div class="card">  <h2>🔐 KYC Verification</h2>  <div class="info">
    Complete secure identity verification.
  </div>  <button onclick="startDidit()">
    🪪 Start KYC Verification
  </button>  <p id="diditMsg"></p></div></main><div class="footer">
  © 2026 YA SALAM BUSINESS
</div><script>

const API =
"https://ya-salam-business-api.onrender.com";

let type = "nin";


/* =========================
   NIN / BVN TYPE
========================= */

function setType(t){

  type = t;

  const number =
    document.getElementById("number");

  number.value = "";

  number.placeholder =
    t === "nin"
    ? "Enter 11-digit NIN"
    : "Enter 11-digit BVN";
}


/* =========================
   CHECK WALLET
========================= */

async function checkWallet(){

  const email =
    document.getElementById("email")
    .value.trim();

  const balance =
    document.getElementById("balance");

  const msg =
    document.getElementById("walletMsg");

  if(!email){

    msg.textContent =
      "Enter your email first";

    return;
  }

  balance.textContent =
    "Loading...";

  msg.textContent =
    "Checking wallet...";

  try{

    const response =
      await fetch(
        API +
        "/api/wallet/" +
        encodeURIComponent(email)
      );

    const data =
      await response.json();

    if(!response.ok ||
       data.status !== "success"){

      throw new Error(
        data.message ||
        "Unable to load wallet"
      );
    }

    const amount =
      Number(
        data.wallet?.balance || 0
      );

    balance.textContent =
      "₦" +
      amount.toFixed(2);

    msg.textContent =
      "Wallet updated successfully";

  }catch(error){

    console.error(error);

    balance.textContent =
      "₦0.00";

    msg.textContent =
      "Unable to load wallet. Please try again.";
  }
}


/* =========================
   FUND WALLET
========================= */

async function fundWallet(){

  const msg =
    document.getElementById("walletMsg");

  try{

    const email =
      document.getElementById("email")
      .value.trim();

    const amount =
      Number(
        document.getElementById("amount")
        .value
      );

    if(!email){

      msg.textContent =
        "Enter your email first";

      return;
    }

    if(!Number.isFinite(amount) ||
       amount < 100){

      msg.textContent =
        "Minimum funding amount is ₦100";

      return;
    }

    msg.textContent =
      "Opening Paystack...";

    const response =
      await fetch(
        API + "/api/wallet/fund",
        {
          method:"POST",

          headers:{
            "Content-Type":
            "application/json"
          },

          body:JSON.stringify({
            email:email,
            amount:amount
          })
        }
      );

    const data =
      await response.json();

    if(!response.ok){

      throw new Error(
        data.message ||
        "Payment request failed"
      );
    }

    if(data.authorization_url){

      msg.textContent =
        "Redirecting to Paystack...";

      window.location.href =
        data.authorization_url;

      return;
    }

    msg.textContent =
      data.message ||
      "Unable to open Paystack.";

  }catch(error){

    console.error(error);

    msg.textContent =
      error.message ||
      "Connection error.";
  }
}


/* =========================
   NIN / BVN VERIFY
========================= */

async function verify(){

  const result =
    document.getElementById("result");

  try{

    const email =
      document.getElementById("email")
      .value.trim();

    const number =
      document.getElementById("number")
      .value.trim();

    if(!email){

      result.textContent =
        "Enter your email first";

      return;
    }

    if(!/^\d{11}$/.test(number)){

      result.textContent =
        "Enter exactly 11 digits";

      return;
    }

    result.textContent =
      "Checking wallet and verifying...";

    const response =
      await fetch(
        API +
        "/api/" +
        type +
        "/verify",
        {
          method:"POST",

          headers:{
            "Content-Type":
            "application/json"
          },

          body:JSON.stringify({
            email:email,
            idNumber:number
          })
        }
      );

    const data =
      await response.json();

    if(data.status !== "success"){

      result.textContent =
        data.message ||
        "Verification failed";

      return;
    }

    result.innerHTML =
      "<div class='success'>" +
      (data.message ||
      "Verification successful") +
      "</div>" +

      "<div>" +
      "Wallet Balance: ₦" +
      Number(
        data.balance || 0
      ).toFixed(2) +
      "</div>";

    if(data.verification){

      const v =
        data.verification.data ||
        data.verification;

      let html =
        "<hr><b>Verification Details</b>";

      function addField(label,value){

        if(
          value !== undefined &&
          value !== null &&
          value !== ""
        ){

          html +=
            "<div style='margin-top:6px'>" +
            "<b>" +
            label +
            ":</b> " +
            String(value) +
            "</div>";
        }
      }

      addField(
        "First Name",
        v.first_name
      );

      addField(
        "Last Name",
        v.last_name
      );

      addField(
        "Date of Birth",
        v.date_of_birth
      );

      addField(
        "Gender",
        v.gender
      );

      addField(
        "Status",
        v.status
      );

      result.innerHTML += html;
    }

    await checkWallet();

  }catch(error){

    console.error(error);

    result.textContent =
      "Connection error. Please try again.";
  }
}


/* =========================
   DIDIT
========================= */

async function startDidit(){

  const email =
    document.getElementById("email")
    .value.trim();

  const msg =
    document.getElementById("diditMsg");

  if(!email){

    msg.textContent =
      "Enter your email first";

    return;
  }

  msg.textContent =
    "Creating secure verification session...";

  try{

    const response =
      await fetch(
        API + "/api/didit/session",
        {
          method:"POST",

          headers:{
            "Content-Type":
            "application/json"
          },

          body:JSON.stringify({
            email:email
          })
        }
      );

    const data =
      await response.json();

    if(!response.ok ||
       data.status !== "success"){

      msg.textContent =
        data.message ||
        "Unable to start Didit verification.";

      return;
    }

    if(!data.url){

      msg.textContent =
        "Didit verification URL not found.";

      return;
    }

    msg.textContent =
      "Opening secure verification...";

    window.location.href =
      data.url;

  }catch(error){

    console.error(
      "Didit error:",
      error
    );

    msg.textContent =
      "Unable to connect to Didit.";
  }
}


/* =========================
   PAYSTACK RETURN
========================= */

const params =
  new URLSearchParams(
    window.location.search
  );

const reference =
  params.get("reference") ||
  params.get("trxref");

if(reference){

  const msg =
    document.getElementById(
      "walletMsg"
    );

  msg.textContent =
    "Confirming payment...";

  fetch(
    API +
    "/api/wallet/verify/" +
    encodeURIComponent(reference)
  )
  .then(
    response =>
      response.json()
  )
  .then(
    data => {

      msg.textContent =
        data.message ||
        "Payment checked";

      checkWallet();

    }
  )
  .catch(
    () => {

      msg.textContent =
        "Unable to confirm payment";
    }
  );
}


/* =========================
   LOAD WALLET
========================= */

checkWallet();

</script></body>
</html>
